# Opt-in wheel_speed reference; ACTUAL FIRMWARE AND PHYSICAL SIGNS ARE UNVERIFIED.
# This file is a candidate for supervised validation, not a calibrated release.
# 0x12 configures independent PWM/encoder polarity; only 0x10 target mm/s is sent.
control_mode: wheel_speed
serial_port: auto
usb_vid: 0x1a86
usb_pid: 0x55d4
serial_number: '5CF0016377'
baud: 115200
counts_per_revolution: 60000  # provisional wheel-end counts; validate against motion
max_wheel_mm_s: 600
test_pwm_limit_permille: 750
# Compatibility declaration only: the host cannot limit PWM in 0x10 mode.
# Reference firmware PWM_CAP=960 / PWM_PERIOD=1600 -> 600 permille; deployed image unverified.
# Lower/higher ros_driver_pwm_limit values are rejected rather than silently ignored.
ros_driver_pwm_limit_permille: 600
# Candidate derived from the selected reference high/low vs high/high bridge formulas:
# [-1,-1,+1,-1] * test_pwm_signs -> [-1,+1,+1,+1]; NOT PHYSICALLY VALIDATED.
pwm_signs: [-1, 1, 1, 1]
test_pwm_signs: [1, -1, 1, -1]  # PWM fallback only, never reused by speed mode
encoder_signs: [-1, 1, -1, 1]  # existing candidate, closed-loop direction not verified
wheel_ports: {left_front: D, right_front: C, left_rear: B, right_rear: A}
wheel_diameter: 0.085
track_width: 0.15
test_duty_permille: 250
wasd_spin_pwm_permille: 300  # existing WASD setting; not a measured start threshold
test_slew_permille_s: 1000  # PWM fallback only; not a wheel-speed acceleration setting
turn_gain_permille_per_rad_s: 283.11258278
linear_speed: 0.22  # open-loop reference, not calibrated m/s
initial_scale: 1.0
min_scale: 0.2
max_scale: 2.0
scale_step: 0.2
key_timeout_s: 0.25
telemetry_timeout_s: 0.5
publish_hz: 20
command_timeout_s: 0.25
teleop_topic: /teleop/cmd_vel
nav_topic: /cmd_vel/nav
mission_topic: /cmd_vel/mission
output_topic: /cmd_vel  # final Mux output, never a planner/teleop publishing target
odom_topic: /wheel/odom
odom_frame: odom
base_frame: base_link
publish_tf: false
