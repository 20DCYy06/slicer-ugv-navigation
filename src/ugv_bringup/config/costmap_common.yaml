# Current Slicer sensor conventions; no Potato footprint or StaticLayer.
transform_tolerance: 0.30
resolution: 0.05
static_map: false
rolling_window: true
track_unknown_space: true
always_send_full_costmap: true
plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
obstacle_layer:
  enabled: true
  observation_sources: scan
  combination_method: 1
  track_unknown_space: true
  footprint_clearing_enabled: true
  scan:
    topic: scan
    data_type: LaserScan
    marking: true
    clearing: true
    obstacle_range: 3.0
    raytrace_range: 4.0
    min_obstacle_height: -0.05
    max_obstacle_height: 0.50
    inf_is_valid: true
    observation_persistence: 0.0
    expected_update_rate: 0.20  # seconds between observations, NOT Hz
inflation_layer:
  enabled: true
  inflation_radius: 0.24
  cost_scaling_factor: 4.5
