# Standard Noetic DWA 1.17.3, with the existing conservative field limits.
# These are commissioning caps, not calibrated physical speed or starting PWM.
# Costs/horizon/sample counts retain the installed DWA defaults used by the
# isolated comparison. Angular granularity .025 gives low-speed turns multiple
# future trajectory samples; .1 produced a one-initial-pose tie at short goals.
DWAPlannerROS:
  odom_topic: odom
  max_vel_trans: 0.125
  min_vel_trans: 0.01
  max_vel_x: 0.125
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.25
  min_vel_theta: 0.05
  acc_lim_x: 0.2
  acc_lim_y: 0.0
  acc_lim_theta: 1.0
  acc_lim_trans: 0.2
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.25
  trans_stopped_vel: 0.01
  theta_stopped_vel: 0.01
  latch_xy_goal_tolerance: false
  sim_time: 1.7
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  path_distance_bias: 0.6
  goal_distance_bias: 0.8
  occdist_scale: 0.01
  twirling_scale: 0.0
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2
  forward_point_distance: 0.325
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  vx_samples: 3
  vy_samples: 1
  vth_samples: 20
  use_dwa: true
  prune_plan: false
