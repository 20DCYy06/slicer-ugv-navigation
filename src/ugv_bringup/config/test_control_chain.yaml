# TEST_ONLY: synthetic inputs and an isolated master in a network-none container.
# No driver uses this file. Final Twist goes only to the nonholonomic test model.
navigation:
  max_forward: 0.125
  max_reverse: 0.0
  max_angular: 0.25
  accel_linear: 0.2
  accel_angular: 1.0
wheel_diameter: 0.085
track_width: 0.15
turn_gain_permille_per_rad_s: 283.11258278
linear_speed: 0.22
test_slew_permille_s: 1000
initial_scale: 1.0
min_scale: 0.2
max_scale: 2.0
scale_step: 0.2
test_pwm_limit_permille: 750
ros_driver_pwm_limit_permille: 600
test_duty_permille: 250
wasd_spin_pwm_permille: 300
test_pwm_signs: [1, -1, 1, -1]
encoder_signs: [-1, 1, -1, 1]
wheel_ports: {left_front: D, right_front: C, left_rear: B, right_rear: A}
key_timeout_s: 0.25
command_timeout_s: 0.25
telemetry_timeout_s: 0.5
publish_hz: 20
base_frame: base_link
teleop_topic: /TEST_ONLY_chain/teleop
mission_topic: /TEST_ONLY_chain/mission
nav_topic: /cmd_vel/nav
output_topic: /TEST_ONLY_chain/final
